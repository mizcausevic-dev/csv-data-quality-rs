name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify release source
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_tag must be an existing vX.Y.Z tag"
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release.outputs.tag }}
      - name: Confirm tagged commit is on main
        id: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin main
          TAG_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$TAG_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::checkout does not match requested tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tagged commit is not on main"
            exit 1
          fi
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify Cargo.toml version matches tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          TAG=${RELEASE_TAG#v}
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -Dwarnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - name: Audit locked dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock

  publish:
    name: cargo publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}
      - name: Confirm release source has not changed
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.release_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$VERIFIED_SHA" ]; then
            echo "::error::tag no longer resolves to the verified commit"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify Cargo.toml version matches tag
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          TAG=${RELEASE_TAG#v}
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
      - name: Dry-run publish
        run: cargo publish --locked --dry-run
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
