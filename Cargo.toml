[package]
name        = "csv-data-quality"
version     = "0.2.0"
edition     = "2021"
rust-version = "1.86"
description = "Record-by-record CSV validation against a data-contract-registry contract with structured violation reports."
license     = "MIT"
repository  = "https://github.com/mizcausevic-dev/csv-data-quality-rs"
homepage    = "https://kineticgain.com/"
documentation = "https://docs.rs/csv-data-quality"
readme      = "README.md"
include     = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "examples/**", "tests/**", "benches/**"]
keywords    = ["csv", "data-quality", "data-contract", "kinetic-gain", "streaming"]
categories  = ["data-structures", "command-line-utilities"]
authors     = ["Miz Causevic <miz@kineticgain.com>"]

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1.0"
csv        = "1.3"
tokio      = { version = "1.38", features = ["rt"] }

[dev-dependencies]
tokio      = { version = "1.38", features = ["full"] }
criterion  = "0.5"
tempfile   = "3.10"

[[bench]]
name    = "validate"
harness = false

[lib]
name = "csv_data_quality"
path = "src/lib.rs"
