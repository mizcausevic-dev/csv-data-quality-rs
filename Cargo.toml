[package]
name        = "csv-data-quality"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.86"
description = "Streaming CSV validator against a data-contract-registry contract. Async, line-by-line, structured violation report. The fourth cross-ecosystem hook in the Kinetic Gain portfolio."
license     = "MIT"
repository  = "https://github.com/mizcausevic-dev/csv-data-quality-rs"
homepage    = "https://kineticgain.com/"
documentation = "https://docs.rs/csv-data-quality"
readme      = "README.md"
keywords    = ["csv", "data-quality", "data-contract", "kinetic-gain", "streaming"]
categories  = ["data-structures", "command-line-utilities"]
authors     = ["Miz Causevic <miz@kineticgain.com>"]

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1.0"
csv        = "1.3"
tokio      = { version = "1.38", features = ["rt", "macros", "fs", "io-util"] }

[dev-dependencies]
tokio      = { version = "1.38", features = ["full"] }
criterion  = "0.5"
tempfile   = "3.10"

[[bench]]
name    = "validate"
harness = false

[lib]
name = "csv_data_quality"
path = "src/lib.rs"
